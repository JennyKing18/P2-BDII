# ==============================================================================
# CI/CD Pipeline: Sistema de Restaurantes
# Propósito: Integración Continua (Testing) y Entrega Continua (Build & Push)
# Registro de Contenedores: GitHub Container Registry (GHCR)
# ==============================================================================
name: CI/CD Pipeline Restaurantes e2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # JOB 1: PRUEBAS Y COBERTURA
  test:
    name: Run Tests & Check Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod' 
          cache: true

      - name: Descargar dependencias
        run: go mod download

      - name: Pruebas Unitarias y reporte de Cobertura
        run: |
          go test -v -coverprofile=coverage.out ./internal/handlers/...
          
      - name: Validar Cobertura (Requisito 90%)
        # awk para hacer la validación matemática de forma segura
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | grep -Eo '[0-9]+\.[0-9]+')
          echo "Cobertura total de la lógica de negocio: $COVERAGE%"
          
          if awk -v cov="$COVERAGE" 'BEGIN {exit !(cov < 90.0)}'; then
            echo "Error: La cobertura ($COVERAGE%) es menor al 90% requerido."
            exit 1
          fi
          echo "Cobertura suficiente."

  # JOB 2: CONSTRUCCIÓN Y PUBLICACIÓN (DOCKER)
  build-and-push:
    name: Build and Push Docker Images
    needs: test # Solo construye si las pruebas pasaron
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- CONSTRUIR API PRINCIPAL ---
      - name: Extraer metadatos para imagen de API Principal
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/restaurant-api
          tags: |
            type=sha,format=long
            latest

      - name: Construir y Publicar API Principal
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- CONSTRUIR SEARCH SERVICE ---
      - name: Extraer metadatos para imagen de Search Service
        id: meta-search
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/restaurant-search
          tags: |
            type=sha,format=long
            latest

      - name: Construir y Publicar Search Service
        uses: docker/build-push-action@v5
        with:
          context: ./internal/search
          file: ./internal/search/Dockerfile
          push: true
          tags: ${{ steps.meta-search.outputs.tags }}
          labels: ${{ steps.meta-search.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max