# ==================================================================
# Configuración de Nginx como API Gateway / Reverse Proxy
# Enruta el tráfico hacia los microservicios y gestión de identidad
# ==================================================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # --- Definición de Upstreams (Backends) ---
    
    upstream api_servers {
        server api:8080; 
    }

    upstream search_servers {
        server search-service:8080; 
    }

    upstream auth_servers {
        server keycloak:8080;
    }

    # --- Configuración del Servidor Virtual ---
    
    server {
        listen 80;

        # --- Microservicio Principal (Go) ---
        location /api/ {
            # Remover prefijo '/api' antes de enrutar al backend
            rewrite ^/api/(.*) /$1 break;
            
            proxy_pass http://api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Tolerancia a fallos: reintento en caso de error o timeout
            proxy_next_upstream error timeout http_500;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        # --- Microservicio de Búsqueda ---
        location /search/ {  
            # Remover prefijo '/search' antes de enrutar al backend
            rewrite ^/search/(.*) /$1 break;
            
            proxy_pass http://search_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Propagar token de autorización al servicio
            proxy_set_header Authorization $http_authorization;
        }

        # --- Servicio de Autenticación (Keycloak) ---
        location /auth/ {
            proxy_pass http://auth_servers/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Cabeceras requeridas por Keycloak al operar detrás de un proxy
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}